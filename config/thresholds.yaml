# ACAS Operational Thresholds — edit here, not in source code.
# Loaded by core/config_loader.py; consumed by risk_scorer, decision_fsm,
# pc_analytic and the REST API.

# Lower-bound adjusted-Pc for each alert level (below yellow ⇒ GREEN).
alerts:
  yellow: 1.0e-5
  orange: 1.0e-4
  red:    1.0e-3

fuel_threshold_scale:
  fuel_above_50pct: 1.0
  fuel_above_30pct: 3.0
  fuel_above_15pct: 8.0
  fuel_below_15pct: 50.0

screening_km: 5.0
tle_stale_threshold_hours: 48
tle_inflation_cap: 5.0
target_miss_distance_km:  5.0
min_dv_ms:                0.1
altitude_floor_margin_km: 20.0
battery_low_threshold_pct: 20.0
battery_inflation_factor:  1.5

lgbm:
  high_risk_percentile:   0.80
  classifier_threshold:   0.65
  risk_score_emergency:  -4.0
  risk_score_manoeuvre:  -5.0
  risk_score_monitoring: -6.0
  risk_score_watch:      -8.0

# Analytic (Foster 2D) collision probability — combined hard-body radius.
# Used as the conservative FALLBACK when the object's RCS size class is unknown.
hard_body_radius_m: 20.0

# Dynamic per-object hard-body radius. When the Space-Track catalog record
# carries an RCS_SIZE class (SMALL/MEDIUM/LARGE), the combined radius becomes
# own_radius_m + the mapped object radius instead of the fixed fallback above.
hard_body:
  own_radius_m:        2.0    # our satellite's physical radius (m)
  rcs_small_radius_m:  0.5    # RCS_SIZE = SMALL   (< 0.1 m²)
  rcs_medium_radius_m: 1.5    # RCS_SIZE = MEDIUM  (0.1–1 m²)
  rcs_large_radius_m:  5.0    # RCS_SIZE = LARGE   (> 1 m²)

# Decision gate — autonomy governance before a burn is executed.
decision_gate:
  veto_window_s:         300     # ground may veto within this window
  autonomous_if_no_link: true    # skip veto wait when no ground contact
  max_autonomous_dv_ms:  2.0     # burns above this always need ground ack
